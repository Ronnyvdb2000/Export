name: VLIF4 wekelijkse check (detectie + download)

on:
  schedule:
    - cron: "0 17 * * 1,3,5"  # elke ma/wo/vr om 17:00 UTC
  workflow_dispatch: {}  # handmatig triggeren kan ook

jobs:
  check-and-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo uitchecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python opzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installeren
        run: pip install requests beautifulsoup4

      - name: Nieuwe PDF-versie checken en evt. downloaden
        id: check
        run: python scripts/check_new_pdf.py

      # Deze commit+push triggert automatisch vlif4-pipeline.yml
      # (build + Phi-validatie + SendGrid-mail), via de push-trigger
      # op input/**/*.pdf.
      - name: Nieuwe input committen en pushen
        if: steps.check.outputs.new_version == 'true'
        run: |
          git config user.name "vlif4-bot"
          git config user.email "vlif4-bot@users.noreply.github.com"
          git add input/ data/last_version.txt
          git commit -m "Nieuwe VLIF4-codelijst gedetecteerd: blok ${{ steps.check.outputs.version }}"
          git push

      - name: Geen nieuwe versie
        if: steps.check.outputs.new_version != 'true'
        run: echo "Geen nieuwe VLIF4-codelijst gevonden — niets te doen."
