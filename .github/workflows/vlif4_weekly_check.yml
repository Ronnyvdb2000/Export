name: VLIF4 wekelijkse check (detectie + download)

on:
  schedule:
    - cron: "0 17 * * 1,3,5"
  workflow_dispatch: {}

jobs:
  check-and-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo uitchecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python opzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installeren
        run: |
          pip install requests resend playwright
          playwright install --with-deps chromium

      - name: Nieuwe PDF-versie checken, oude verwijderen en nieuwe downloaden
        id: check
        run: python scripts/check_new_pdf.py

      - name: Wijzigingen committen en pushen
        if: steps.check.outputs.new_version == 'true'
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "vlif4-bot"
          git config user.email "vlif4-bot@users.noreply.github.com"
          git add -A input/ data/
          git commit -m "Nieuwe VLIF4-codelijst gedetecteerd: blok ${{ steps.check.outputs.version }} (oude PDF vervangen)"
          git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git HEAD:main

      - name: Geen nieuwe versie
        if: steps.check.outputs.new_version != 'true'
        run: echo "Geen nieuwe VLIF4-codelijst gevonden — niets te doen."

      - name: Bepaal ontvanger
        id: recipient
        if: always()
        run: |
          if [ -f data/notify_email.txt ] && [ -s data/notify_email.txt ]; then
            echo "email=$(cat data/notify_email.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          else
            echo "email=" >> "$GITHUB_OUTPUT"
          fi

      - name: Statusmail versturen
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          NOTIFY_EMAIL: ${{ steps.recipient.outputs.email || secrets.NOTIFY_EMAIL }}
        run: |
          python scripts/send_status_email.py \
            --new-version "${{ steps.check.outputs.new_version || 'false' }}" \
            --version "${{ steps.check.outputs.version }}" \
            --previous-version "${{ steps.check.outputs.previous_version }}"
