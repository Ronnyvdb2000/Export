for f in "${FILES[@]}"; do
  echo ""
  echo "================================================="
  echo "📄 VERWERKEN: $f"
  echo "================================================="

  base=$(basename "${f%.pdf}")

  # HIER AANGEPAST: --input-pdf -> --input en --output-xlsx -> --output
  python src/layout_engine.py \
    --input "$f" \
    --output "output/${base}_raw.xlsx"

  if [ ! -f "output/${base}_raw.xlsx" ]; then
    echo "❌ RAW XLSX niet aangemaakt"
    exit 1
  fi

  echo "✅ RAW XLSX OK"
done
