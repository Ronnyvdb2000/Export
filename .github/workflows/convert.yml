name: Convert PDF to Excel

on:
  push:
    paths:
      - 'input/**/*.pdf'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python packages
        run: |
          pip install pandas openpyxl odfpy pdfplumber
      
      - name: Create directories
        run: mkdir -p input output
      
      - name: Debug files
        run: |
          echo "Input directory:"
          ls -la input/ || echo "No input files yet"
          echo "Source files:"
          ls -la src/
      
      - name: Run converter
        run: python src/convert.py --input-dir input --output-dir output
      
      - name: Upload Excel files
        uses: actions/upload-artifact@v4
        with:
          name: converted-excel-files
          path: output/*.xlsx
          if-no-files-found: warn
