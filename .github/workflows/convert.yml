name: Convert PDF to Excel

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/**/*.pdf'

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install pymupdf pandas openpyxl

      - name: Create output dir
        run: mkdir -p output

      - name: Convert PDFs
        run: |
          for f in input/*.pdf; do
            echo "Processing $f"

            base=$(basename "${f%.pdf}")

            python src/layout_engine.py \
              --input-pdf "$f" \
              --output-xlsx "output/${base}_raw.xlsx"

            python src/build_excel.py \
              --input "output/${base}_raw.xlsx" \
              --output "output/${base}.xlsx"
          done

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: converted-files
          path: output/*.xlsx
