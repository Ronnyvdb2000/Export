name: Convert PDF to Excel (PyMuPDF engine)

on:
  push:
    paths:
      - 'input/**/*.pdf'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pymupdf pandas openpyxl

      - name: Create output directory
        run: mkdir -p output

      - name: Convert PDFs
        run: |
          for f in input/*.pdf; do
            echo "🚀 Verwerken: $f"
            base=$(basename "${f%.pdf}")

            python src/layout_engine.py \
              --input-pdf "$f" \
              --output-xlsx "output/${base}_raw.xlsx"

            python src/build_excel.py \
              --input "output/${base}_raw.xlsx" \
              --output "output/${base}.xlsx"
          done

      - name: Cleanup raw files
        run: rm -f output/*_raw.xlsx

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: converted-files
          path: output/*.xlsx
