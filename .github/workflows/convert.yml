name: Convert PDF to Excel (PyMuPDF engine)

on:
  push:
    paths:
      - 'input/**/*.pdf'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pymupdf pandas openpyxl

      - name: Create directories
        run: |
          mkdir -p input
          mkdir -p output

      - name: Run new layout engine
        run: |
          for f in input/*.pdf; do
            echo "🚀 Verwerken: $f"
            python src/layout_engine.py \
              --input-pdf "$f" \
              --output-xlsx "output/$(basename "${f%.pdf}.xlsx")"
          done

      - name: Show output files
        run: |
          echo "📂 OUTPUT:"
          ls -lah output/

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v5
        with:
          name: converted-excel-files
          path: output/*.xlsx
          if-no-files-found: error
