      - name: Commit output to export-output branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git checkout -B export-output

          mkdir -p output
          touch output/.gitkeep

          # FIX: kopieer output naar root, niet naar zichzelf
          cp -r output/* .

          git add *.xlsx || true
          git add *.db || true
          git add output/ || true

          git commit -m "Automatische export $(date)" || echo "Geen wijzigingen"
          git push origin export-output --force
