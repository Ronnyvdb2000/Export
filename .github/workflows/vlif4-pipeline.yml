name: VLIF4 Pipeline (build + validate + mail)

on:
  workflow_dispatch:
    inputs:
      notify_email:
        description: "E-mailadres voor het resultaat (leeg = gebruik NOTIFY_EMAIL secret)"
        required: false
        type: string

env:
  PHI_MODEL_URL: "https://huggingface.co/microsoft/Phi-3.5-mini-instruct-gguf/resolve/main/Phi-3.5-mini-instruct-Q4_K_M.gguf"
  PHI_MODEL_FILE: "Phi-3.5-mini-instruct-Q4_K_M.gguf"
  PDF_DIR: "input"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install pymupdf openpyxl pandas

      - name: Verwerk alle PDF's in input/
        run: |
          mkdir -p output raw
          shopt -s nullglob
          for pdf in "$PDF_DIR"/*.pdf; do
            name=$(basename "$pdf" .pdf)
            echo "=== Verwerken: $pdf ==="
            python src/layout_engine.py --input-pdf "$pdf" --output-xlsx "raw/${name}.xlsx"
            python src/build_excel.py --input "raw/${name}.xlsx" --output "output/${name}.xlsx"
          done
          ls -la output/

      - name: Upload Excel-bestanden als artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlif4-excels
          path: output/*.xlsx

  validate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # nodig om de originele PDF's opnieuw ter beschikking te hebben

      - name: Download Excel-artifacts
        uses: actions/download-artifact@v4
        with:
          name: vlif4-excels
          path: output

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install pymupdf openpyxl llama-cpp-python pandas

      - name: Cache Phi-model
        id: cache-phi
        uses: actions/cache@v4
        with:
          path: ${{ env.PHI_MODEL_FILE }}
          key: phi-model-${{ env.PHI_MODEL_FILE }}

      - name: Download Phi-model (indien niet gecached)
        if: steps.cache-phi.outputs.cache-hit != 'true'
        run: curl -L "${{ env.PHI_MODEL_URL }}" -o "${{ env.PHI_MODEL_FILE }}"

      - name: Valideer elk Excel-bestand
        id: validation
        run: |
          mkdir -p reports
          overall_issues=0
          for xlsx in output/*.xlsx; do
            name=$(basename "$xlsx" .xlsx)
            pdf="${PDF_DIR}/${name}.pdf"
            echo "=== Valideren: $xlsx tegen $pdf ==="
            if python src/validatie_output.py \
                --excel "$xlsx" \
                --source-pdf "$pdf" \
                --model "${{ env.PHI_MODEL_FILE }}" \
                --report-out "reports/${name}_validation_report.xlsx"; then
              echo "OK: $name"
            else
              echo "ISSUES: $name"
              overall_issues=1
            fi
          done
          echo "issues_found=$overall_issues" >> "$GITHUB_ENV"

      - name: Upload validatierapporten als artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: reports/*.xlsx

      - name: Sla issues_found status op
        run: echo "${{ env.issues_found }}" > issues_found.txt

      - name: Upload issues_found status
        uses: actions/upload-artifact@v4
        with:
          name: issues-found-flag
          path: issues_found.txt

  notify:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Excel-artifacts
        uses: actions/download-artifact@v4
        with:
          name: vlif4-excels
          path: attachments

      - name: Download validatierapporten
        uses: actions/download-artifact@v4
        with:
          name: validation-reports
          path: attachments

      - name: Download issues_found status
        uses: actions/download-artifact@v4
        with:
          name: issues-found-flag

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install sendgrid

      - name: Verstuur mail via SendGrid
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM: ${{ secrets.SENDGRID_FROM }}
          NOTIFY_EMAIL: ${{ inputs.notify_email || secrets.NOTIFY_EMAIL }}
        run: |
          ISSUES=$(cat issues_found.txt)
          python send_email.py --attachments-dir attachments --issues-found "$ISSUES"
