name: VLIF4 Pipeline (build + validate + mail)

on:
  workflow_run:
    workflows: ["VLIF4 wekelijkse check (detectie + download)"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      notify_email:
        description: "E-mailadres voor het resultaat (leeg = gebruik data/notify_email.txt, of anders de NOTIFY_EMAIL secret)"
        required: false
        type: string

env:
  PHI_MODEL_URL: "https://huggingface.co/bartowski/Phi-3.5-mini-instruct-GGUF/resolve/main/Phi-3.5-mini-instruct-Q4_K_M.gguf"
  PHI_MODEL_FILE: "Phi-3.5-mini-instruct-Q4_K_M.gguf"
  PDF_DIR: "input"

jobs:
  build:
    runs-on: ubuntu-latest
    # Start alleen als de vorige workflow slaagde, of bij handmatige start
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      has_new_pdf: ${{ steps.check_new.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Controleer of er een nieuwe PDF is
        id: check_new
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log -1 --pretty=%B | grep -q "Nieuwe VLIF4-codelijst"; then
            echo "Nieuwe PDF gevonden."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Geen nieuwe PDF. Build wordt overgeslagen."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check_new.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        if: steps.check_new.outputs.run == 'true'
        run: pip install pymupdf openpyxl pandas

      - name: Verwerk alle PDF's in input/
        if: steps.check_new.outputs.run == 'true'
        run: |
          mkdir -p output raw
          shopt -s nullglob
          FOUND_PDF=0
          for pdf in "$PDF_DIR"/*.pdf; do
            FOUND_PDF=1
            name=$(basename "$pdf" .pdf)
            echo "=== Verwerken: $pdf ==="
            
            # Fail-safe: vang corrupte PDFs af zodat de run niet klapt
            if python src/layout_engine.py --input-pdf "$pdf" --output-xlsx "raw/${name}.xlsx"; then
              python src/build_excel.py --input "raw/${name}.xlsx" --output "output/${name}.xlsx"
            else
              echo "WAARSCHUWING: Kon $pdf niet verwerken (mogelijk corrupt). Ga door."
            fi
          done
          
          if [ "$FOUND_PDF" -eq 0 ]; then
            echo "FOUT: Geen PDF-bestanden gevonden in $PDF_DIR"
            exit 1
          fi
          ls -la output/

      - name: Upload Excel-bestanden als artifact
        if: steps.check_new.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vlif4-excels
          path: output/*.xlsx

  validate:
    needs: build
    # Draai alleen als build écht iets heeft gedaan
    if: needs.build.outputs.has_new_pdf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download Excel-artifacts
        uses: actions/download-artifact@v4
        with:
          name: vlif4-excels
          path: output

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install pymupdf openpyxl llama-cpp-python pandas

      - name: Cache Phi-model
        id: cache-phi
        uses: actions/cache@v4
        with:
          path: ${{ env.PHI_MODEL_FILE }}
          key: phi-model-${{ env.PHI_MODEL_FILE }}

      - name: Download Phi-model (indien niet gecached)
        if: steps.cache-phi.outputs.cache-hit != 'true'
        run: |
          curl -L "${{ env.PHI_MODEL_URL }}" -o "${{ env.PHI_MODEL_FILE }}"
          size=$(stat -c%s "${{ env.PHI_MODEL_FILE }}")
          echo "Gedownload bestand: $size bytes"
          if [ "$size" -lt 1000000000 ]; then
            echo "FOUT: bestand is te klein ($size bytes) — download is waarschijnlijk mislukt"
            exit 1
          fi

      - name: Valideer elk Excel-bestand
        id: validation
        run: |
          mkdir -p reports
          overall_issues=0
          for xlsx in output/*.xlsx; do
            name=$(basename "$xlsx" .xlsx)
            pdf="${PDF_DIR}/${name}.pdf"
            echo "=== Valideren: $xlsx tegen $pdf ==="
            if python src/validatie_output.py \
                --excel "$xlsx" \
                --source-pdf "$pdf" \
                --model "${{ env.PHI_MODEL_FILE }}" \
                --report-out "reports/${name}_validation_report.xlsx"; then
              echo "OK: $name"
            else
              echo "ISSUES: $name"
              overall_issues=1
            fi
          done
          echo "issues_found=$overall_issues" >> "$GITHUB_ENV"

      - name: Upload validatierapporten als artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: reports/*.xlsx

      - name: Sla issues_found status op
        run: echo "${{ env.issues_found }}" > issues_found.txt

      - name: Upload issues_found status
        uses: actions/upload-artifact@v4
        with:
          name: issues-found-flag
          path: issues_found.txt

  notify:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download Excel-artifacts
        uses: actions/download-artifact@v4
        with:
          name: vlif4-excels
          path: attachments

      - name: Download validatierapporten
        uses: actions/download-artifact@v4
        with:
          name: validation-reports
          path: attachments

      - name: Download issues_found status
        uses: actions/download-artifact@v4
        with:
          name: issues-found-flag

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install resend

      - name: Bepaal ontvanger
        id: recipient
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.notify_email }}" ]; then
            echo "email=${{ inputs.notify_email }}" >> "$GITHUB_OUTPUT"
          elif [ -f data/notify_email.txt ] && [ -s data/notify_email.txt ]; then
            echo "email=$(cat data/notify_email.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          else
            echo "email=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verstuur mail via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          NOTIFY_EMAIL: ${{ steps.recipient.outputs.email || secrets.NOTIFY_EMAIL }}
        run: |
          ISSUES=$(cat issues_found.txt)
          python send_email.py --attachments-dir attachments --issues-found "$ISSUES"
