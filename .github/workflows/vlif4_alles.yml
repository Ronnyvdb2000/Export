name: VLIF4 Alles-in-één (check, build, validate, mail)

on:
  schedule:
    - cron: "0 17 * * 1,3,5"
  workflow_dispatch: {}
  push:
    paths:
      - 'input/**/*.pdf'
      - 'data/**'

env:
  PHI_MODEL_URL: "https://huggingface.co/bartowski/Phi-3.5-mini-instruct-GGUF/resolve/main/Phi-3.5-mini-instruct-Q4_K_M.gguf"
  PHI_MODEL_FILE: "Phi-3.5-mini-instruct-Q4_K_M.gguf"
  PDF_DIR: "input"

jobs:
  check-and-fetch:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      version: ${{ steps.check.outputs.version }}
      previous_version: ${{ steps.check.outputs.previous_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: |
          pip install requests resend playwright
          playwright install --with-deps chromium

      - name: Check en download PDF
        id: check
        run: python scripts/check_new_pdf.py

      - name: Commit en push wijzigingen (indien nieuwe PDF)
        if: steps.check.outputs.new_version == 'true'
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "vlif4-bot"
          git config user.email "vlif4-bot@users.noreply.github.com"
          git add -A input/ data/
          git commit -m "Nieuwe VLIF4-codelijst gedetecteerd: blok ${{ steps.check.outputs.version }}"
          git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git HEAD:main

      - name: Bepaal ontvanger
        id: recipient
        if: always()
        run: |
          if [ -f data/notify_email.txt ] && [ -s data/notify_email.txt ]; then
            echo "email=$(cat data/notify_email.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          else
            echo "email=" >> "$GITHUB_OUTPUT"
          fi

      - name: Statusmail versturen
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          NOTIFY_EMAIL: ${{ steps.recipient.outputs.email || secrets.NOTIFY_EMAIL }}
        run: |
          python scripts/send_status_email.py \
            --new-version "${{ steps.check.outputs.new_version || 'false' }}" \
            --version "${{ steps.check.outputs.version }}" \
            --previous-version "${{ steps.check.outputs.previous_version }}"

  build:
    needs: check-and-fetch
    # Draai alleen als de check een nieuwe PDF heeft gevonden
    if: needs.check-and-fetch.outputs.new_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install pymupdf openpyxl pandas

      - name: Verwerk alle PDF's in input/
        run: |
          mkdir -p output raw
          shopt -s nullglob
          for pdf in "$PDF_DIR"/*.pdf; do
            name=$(basename "$pdf" .pdf)
            echo "=== Verwerken: $pdf ==="
            if python src/layout_engine.py --input-pdf "$pdf" --output-xlsx "raw/${name}.xlsx"; then
              python src/build_excel.py --input "raw/${name}.xlsx" --output "output/${name}.xlsx"
            else
              echo "WAARSCHUWING: Kon $pdf niet verwerken. Ga door."
            fi
          done
          ls -la output/

      - name: Upload Excel-bestanden als artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlif4-excels
          path: output/*.xlsx

  validate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Excel-artifacts
        uses: actions/download-artifact@v4
        with:
          name: vlif4-excels
          path: output
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installeer dependencies
        run: pip install pymupdf openpyxl llama-cpp-python pandas

      - name: Cache Phi-model
        id: cache-phi
        uses: actions/cache@v4
        with:
          path: ${{ env.PHI_MODEL_FILE }}
          key: phi-model-${{ env.PHI_MODEL_FILE }}

      - name: Download Phi-model (indien niet gecached)
        if: steps.cache-phi.outputs.cache-hit != 'true'
        run: |
          curl -L "${{ env.PHI_MODEL_URL }}" -o "${{ env.PHI_MODEL_FILE }}"
          size=$(stat -c%s "${{ env.PHI_MODEL_FILE }}")
          echo "Gedownload bestand: $size bytes"
          if [ "$size" -lt 1000000000 ]; then
            echo "FOUT: bestand is te klein"
            exit 1
          fi

      - name: Valideer elk Excel-bestand
        id: validation
        run: |
          mkdir -p reports
          overall_issues=0
          for xlsx in output/*.xlsx; do
            name=$(basename "$xlsx" .xlsx)
            pdf="${PDF_DIR}/${name}.pdf"
            echo "=== Valideren: $xlsx tegen $pdf ==="
            if python src/validatie_output.py --excel "$xlsx" --source-pdf "$pdf" --model "${{ env.PHI_MODEL_FILE }}" --report-out "reports/${name}_validation_report.xlsx"; then
              echo "OK: $name"
            else
              echo "ISSUES: $name"
              overall_issues=1
            fi
          done
          echo "issues_found=$overall_issues" >> "$GITHUB_ENV"

      - name: Upload validatierapporten als artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: reports/*.xlsx

      - name: Sla issues_found status op
        run: echo "${{ env.issues_found }}" > issues_found.txt

      - name: Upload issues_found status
        uses: actions/upload-artifact@v4
        with:
          name: issues-found-flag
          path: issues_found.txt

  notify:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Excel-artifacts
        uses: actions/download-artifact@v4
        with:
          name: vlif4-excels
          path: attachments
      - name: Download validatierapporten
        uses: actions/download-artifact@v4
        with:
          name: validation-reports
          path: attachments
      - name: Download issues_found status
        uses: actions/download-artifact@v4
        with:
          name: issues-found-flag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installeer dependencies
        run: pip install resend

      - name: Bepaal ontvanger
        id: recipient
        run: |
          if [ -f data/notify_email.txt ] && [ -s data/notify_email.txt ]; then
            echo "email=$(cat data/notify_email.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          else
            echo "email=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verstuur mail via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          NOTIFY_EMAIL: ${{ steps.recipient.outputs.email || secrets.NOTIFY_EMAIL }}
        run: |
          ISSUES=$(cat issues_found.txt)
          python send_email.py --attachments-dir attachments --issues-found "$ISSUES"
